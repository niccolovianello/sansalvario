<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.S.D. San Salvario</title>
<meta name="theme-color" content="#f6f7fa">
<script>/* tema prima del render, niente lampo */try{var t=localStorage.getItem((/-test\//.test(location.pathname)?'test-':'')+'tema');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#17255a;--ink:#12204f;--red:#dc143c;--rfill:#dc143c;--bg:#f6f7fa;--card:#fff;--line:#e2e5ee;--muted:#646c8a;--green:#1b7d52;--gfill:#1b7d52;--cond:'Barlow Condensed','Arial Narrow','Liberation Sans Narrow',sans-serif;--body:'DM Sans',system-ui,sans-serif;--field:#fff;color-scheme:light}
:root[data-theme=dark]{--navy:#24387f;--ink:#e6eaf6;--red:#ff5c7a;--rfill:#dc143c;--bg:#0c1229;--card:#151d3d;--line:#283361;--muted:#98a1c2;--green:#35b07c;--gfill:#1b7d52;--field:#101836;color-scheme:dark}
body,.stat,.panel,.cal button,.rank,.opt,select,input{transition:background-color .35s,border-color .35s,color .35s}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:16px clamp(16px,4vw,32px) 56px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px;font:700 22px var(--cond);letter-spacing:.06em;text-transform:uppercase}
.test-chip{display:none;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--rfill);color:#fff;font:700 12px var(--body);letter-spacing:.06em;vertical-align:middle}
.test .test-chip{display:inline-block}
.motto{margin:2px 0 0;font:italic 400 14px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.club{display:inline;margin:0;font:inherit}
.top small{display:block;margin-top:2px;font:500 13px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.hero{background:var(--navy);color:#fff;border-radius:24px;padding:22px;background-image:linear-gradient(115deg,transparent 55%,rgba(255,255,255,.05) 55%,rgba(255,255,255,.05) 75%,transparent 75%)}
.hhead{display:flex;gap:12px;align-items:flex-start}
.hhead .chips{flex:1}
.hnav{flex:none;display:flex;gap:8px}
.hnav button{width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.hnav button:disabled{opacity:.3;cursor:default}
.chip.go-next{border:0;color:#fff;font-family:var(--body);cursor:pointer;text-transform:uppercase}
.hero :focus-visible{outline-color:#fff}
[data-theme=dark] .hero{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.chips{display:flex;gap:12px;align-items:center;font-size:15px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.14);padding:4px 12px;border-radius:8px;font-weight:700;font-size:12px;letter-spacing:.15em}
.where{display:flex;gap:12px;border-top:1px solid rgba(255,255,255,.2);padding-top:18px;font-size:15px;opacity:.95}
.where svg{flex:none;margin-top:2px}
.live{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin:14px 2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(31,138,91,.15)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat p{margin:0;color:var(--muted);font-size:14px}
.stat b{display:block;font:700 46px/1.1 var(--cond);margin:4px 0}
.stat.red b{color:var(--red)}
.stat small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-top:16px;overflow:hidden}
.tabs{display:flex;gap:26px;padding:0 22px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:4px solid transparent;font:700 21px var(--cond);padding:18px 0 14px;color:var(--muted);cursor:pointer;display:flex;gap:10px;align-items:center}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--red)}
.tab em{font:500 14px var(--body);font-style:normal;background:var(--bg);border-radius:8px;padding:2px 9px}
.body{padding:22px}
.step{display:flex;gap:16px;margin-bottom:8px}
.num{flex:none;width:48px;height:48px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 16px var(--body)}
.step h2{font:700 26px/1.2 var(--cond);margin:0}
.step p{margin:2px 0 0;color:var(--muted);font-size:15px;text-wrap:pretty}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.opt{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--muted);font:500 17px var(--body);cursor:pointer}
.opt[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.yes[aria-pressed=true]{background:var(--gfill);border-color:var(--gfill)}
.opt.no[aria-pressed=true]{background:var(--rfill);border-color:var(--rfill)}
label{display:block;font-weight:700;font-size:15px;margin:16px 0 8px}
select,input{width:100%;min-height:52px;font:inherit;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--field);color:var(--ink)}
.go{width:100%;min-height:56px;margin-top:22px;border:0;border-radius:14px;background:var(--rfill);color:#fff;font:700 18px var(--body);cursor:pointer}
.go:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.ok{margin-top:12px;color:var(--green);font-weight:700;min-height:24px}
.grp h3{font:700 20px var(--cond);margin:18px 0 6px;letter-spacing:.03em}
.sqh{font:700 28px/1.1 var(--cond);text-transform:uppercase;letter-spacing:.04em;margin:36px 0 0;padding-bottom:10px;border-bottom:4px solid var(--red)}
.sqh:first-child{margin-top:0}
.sqh em{font:500 14px var(--body);font-style:normal;background:var(--bg);border-radius:8px;padding:2px 9px;margin-left:8px;vertical-align:middle;letter-spacing:0;text-transform:none}
.grp ul{list-style:none;margin:0;padding:0}
.grp li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.grp li span{color:var(--muted);font-size:13px;text-align:right}
.grp .who{display:flex;align-items:center;gap:14px}
.nr{flex:none;width:30px;height:30px;border-radius:50%;background:var(--rfill);color:#fff;display:grid;place-items:center;font:700 15px var(--cond)}
.nr.none{background:none}
h2.sec{font:700 28px var(--cond);margin:34px 2px 12px}
.sw{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;margin:34px 2px 12px}
.swb{background:none;border:0;padding:0;font:700 28px var(--cond);color:var(--ink);opacity:.55;cursor:pointer;transition:opacity .15s}
.swb[aria-selected=true]{opacity:1}
@media (max-width:480px){.sw{gap:16px}.swb{font-size:24px}}
.rank{list-style:none;margin:0;padding:6px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.rank li{display:grid;grid-template-columns:26px minmax(0,1fr) 34px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border-bottom:0}.rank li.none{display:block}
.rank .pos{font:700 18px var(--cond);color:var(--muted)}
.rank .nm{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .val{font:700 26px/1 var(--cond);text-align:right}
.rank .empty{display:block;color:var(--muted);font-size:14px;padding:8px 0}
.cal button{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.cal button[aria-current=true]{border:2px solid var(--navy)}
[data-theme=dark] .cal button[aria-current=true]{border-color:#6a7fd6}
.cal b{font:700 20px var(--cond);text-transform:uppercase}
.cal small{color:var(--muted);display:block}
.cal .r{font:700 22px var(--cond);white-space:nowrap;text-align:right}
.note{font-size:13px;color:var(--muted);margin-top:16px}
.goals{grid-row:2;text-align:center;font-size:14px}
.goals.c1{grid-column:1}.goals.c3{grid-column:3}
.goals ul{list-style:none;margin:0;padding:0}
.goals li{padding:3px 0;font-weight:500}
.cal .r small{font:500 12px var(--body)}
.r.w{color:var(--green)}.r.l{color:var(--red)}.r.d{color:var(--muted)}
.match3{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);gap:8px;align-items:center;margin:28px 0 24px}
.tm{font:700 clamp(22px,6vw,38px)/1.02 var(--cond);text-transform:uppercase;text-align:center;overflow-wrap:break-word;opacity:.85}
.tm.sm{font-size:clamp(18px,4.9vw,32px)}
.tm.me{opacity:1}
.mid{text-align:center}
.mid .t1{font:700 clamp(40px,11vw,56px)/1 var(--cond)}
.mid .t2{font:700 clamp(30px,8vw,40px)/1 var(--cond);opacity:.75;margin-top:14px}
.mid span{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:4px}
.mid .big{font:700 clamp(46px,13vw,64px)/1 var(--cond)}
.mid .out{display:inline-block;font-size:14px;margin-top:8px;padding:2px 10px;border-radius:8px;background:rgba(255,255,255,.14)}
.mid .out.w{background:var(--gfill)}.mid .out.l{background:var(--rfill)}
.subs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.subs a span{white-space:nowrap}
.subs a{flex:1 1 200px;display:flex;justify-content:center;gap:12px;align-items:center;text-align:left;text-decoration:none;background:var(--navy);color:#fff;font-weight:700;border-radius:14px;padding:14px 16px}
@media (min-width:900px){
  main{max-width:1760px;padding:24px clamp(28px,3.5vw,56px) 72px}
  .cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:clamp(32px,3vw,56px);align-items:start}
  .side h2.sec:first-child,.side .sw:first-child{margin-top:0}
  .top{font-size:26px}
}
@media (max-width:380px){
  main{padding:12px 12px 48px}
  .hero{padding:18px}
  .stat{padding:10px}.stat b{font-size:38px}
  .tabs{gap:18px;padding:0 16px}.body{padding:16px}
}
@media (min-width:900px){.match3{grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr)}}
@media (min-width:1400px){.match3{grid-template-columns:minmax(0,1fr) 180px minmax(0,1fr)}}
.lock{max-width:440px;margin:0 auto}
.lock h2{font:700 clamp(40px,12vw,56px)/.95 var(--cond);text-transform:uppercase;margin:18px 0 10px}
.lock p{margin:0;opacity:.8}
.lock label{color:#fff;margin-top:26px}
.lock input{text-transform:uppercase;letter-spacing:.3em;font:700 24px var(--cond);text-align:center;border:0}
.lock .err{min-height:24px;margin-top:12px;font-weight:700;color:#ffb3c1}
.ac{position:relative}
.ac ul{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;list-style:none;margin:0;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(18,32,79,.14);max-height:320px;overflow:auto}
.ac li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:15px}
.ac li[aria-selected=true]{background:var(--bg)}
@media (hover:hover){.ac li:hover{background:var(--bg)}}
.ac li small{margin-left:auto;color:var(--muted);font-size:12px}
.ac li.none{color:var(--muted);cursor:default;background:none}
.hint{color:var(--red);font-size:13px;min-height:18px;margin:6px 0 0}
.pick{display:flex;align-items:center;gap:14px;margin:0;padding:9px 0;border-bottom:1px solid var(--line);font-weight:400;cursor:pointer}
.pick input{width:22px;height:22px;min-height:0;margin:0 0 0 auto;accent-color:var(--rfill);flex:none}
.pick.off{opacity:.45;cursor:not-allowed}
.cnt{font:700 22px var(--cond);margin:18px 0 4px}.cnt.full{color:var(--red)}
.grp .note{font-size:13px;color:var(--muted);margin:-2px 0 6px}
.tabs{overflow-x:auto;scrollbar-width:none}.tab{white-space:nowrap;flex:none}
@media (max-width:480px){.tabs{gap:16px;padding:0 16px}.tab{font-size:18px;gap:6px}}
@media (max-width:380px){.tabs{gap:12px}.tab{font-size:17px}}
.prev{font-size:14px;color:var(--muted);margin:8px 0 0}
.foot-btns{display:flex;gap:18px;flex-wrap:wrap}
.top-r{display:flex;align-items:center;gap:14px}
.theme{flex:none;width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink);cursor:pointer;transition:background-color .35s,border-color .35s,color .35s}
.theme svg{overflow:visible}
.theme .sun{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.5,1.6,.4,.9)}
.theme .cut{transition:transform .5s cubic-bezier(.5,1.6,.4,.9)}
.theme .rays{transform-origin:12px 12px;transition:transform .5s cubic-bezier(.5,1.6,.4,.9),opacity .3s}
[data-theme=dark] .theme .sun{transform:scale(1.75)}
[data-theme=dark] .theme .cut{transform:translate(-7px,5px)}
[data-theme=dark] .theme .rays{transform:rotate(-90deg) scale(.4);opacity:0}
@media (prefers-reduced-motion:reduce){.theme *,body,.stat,.panel,.cal button,.rank,.opt,select,input{transition:none!important}}
.cal .nx{flex:none;align-self:center;font:700 12px var(--body);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--rfill);padding:3px 9px;border-radius:8px}
::placeholder{color:var(--muted);opacity:1}
.live.bad .dot{background:var(--muted);box-shadow:0 0 0 5px rgba(100,108,138,.18)}
.live.bad{color:var(--red)}
.ok.bad{color:var(--red);display:flex;gap:8px;align-items:flex-start}
.ok.bad svg{flex:none;margin-top:3px}
.mine{margin:6px 0 0;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:15px}
.why{color:var(--muted);font-size:13px;min-height:18px;margin:8px 0 0}
.link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link.del{display:block;margin:18px auto 0;color:var(--red);font-weight:500}
.past p{margin:14px 0 0}
@media (max-width:480px){.stat p{min-height:2.5em;line-height:1.25}}
.out-btn{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="top"><div><h1 class="club">A.S.D. San Salvario</h1><span class="test-chip">Test</span><small id="season"></small><p class="motto">“Ci entra prima in culo che in testa”</p></div><div class="top-r"><button class="theme" id="theme" type="button" aria-label="Tema scuro" aria-pressed="false"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><mask id="moon-cut"><rect x="-6" y="-6" width="36" height="36" fill="#fff"/><circle class="cut" cx="25" cy="2" r="6.5" fill="#000"/></mask><circle class="sun" cx="12" cy="12" r="5" fill="currentColor" mask="url(#moon-cut)"/><g class="rays" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12h2.5M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg></button></div></div>
  <form class="hero lock" id="lock" hidden>
    <span class="chip">AREA SQUADRA</span>
    <h2>Inserisci il codice</h2>
    <p>Te lo chiediamo una volta sola su questo dispositivo.</p>
    <label for="code">Codice squadra</label>
    <input id="code" type="text" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
    <button class="go" type="submit">Entra</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="cols" id="app" hidden><div class="main-col">
  <section class="hero" id="hero" aria-label="Partita"></section>
  <div class="live"><span class="dot"></span><span id="mode"></span></div>
  <section class="stats" id="stats"></section>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-me" aria-selected="true" aria-controls="body" data-tab="me">La tua presenza</button>
      <button class="tab" role="tab" id="t-sq" aria-selected="false" aria-controls="body" tabindex="-1" data-tab="sq">La squadra <em id="sqn">0</em></button>
      <button class="tab" role="tab" id="t-ris" aria-selected="false" aria-controls="body" tabindex="-1" data-tab="ris">Risultato</button>
      <button class="tab" role="tab" id="t-conv" aria-selected="false" aria-controls="body" tabindex="-1" data-tab="conv" hidden>Convocati</button>
    </div>
    <div class="body" id="body" role="tabpanel" aria-labelledby="t-me"></div>
  </section>

  </div>
  <aside class="side">
  <div class="sw" role="tablist">
    <button class="swb" role="tab" id="s-cal" aria-controls="cal" data-side="cal" aria-selected="true">Calendario</button>
    <button class="swb" role="tab" id="s-rank" aria-controls="rank" tabindex="-1" data-side="rank" aria-selected="false">Classifica marcatori</button>
  </div>
  <div class="cal" id="cal" role="tabpanel" aria-labelledby="s-cal"></div>
  <ol class="rank" id="rank" role="tabpanel" aria-labelledby="s-rank" hidden></ol>

  <p class="note" id="foot"></p>
  </aside></div>
</main>

<script>
/* ============ DA MODIFICARE: i dati della squadra ============ */
const CONFIG = {
  season: "Stagione 2026/27",
  // Calendario in abbonamento (file .ics). Se presente, il sito legge da qui le partite al posto dell’elenco MATCHES qui sotto.
  icsUrl: "webcal://gist.githubusercontent.com/niccolovianello/ec59381245bb87a38118c26b932f14de/raw/san_salvario_2026-27.ics",
  // Realtime Database Firebase: rosa e presenze stanno sotto /t/<codice squadra>/ (il codice non è scritto qui, lo sanno solo la squadra e le regole Firebase).
  firebaseUrl: "https://asd-san-salvario-default-rtdb.europe-west1.firebasedatabase.app"
};
// date in formato AAAA-MM-GGTHH:MM (ora del fischio d’inizio).
let MATCHES = [
  {id:"262a2-2026-27-san-salvario-calendar",  date:"2026-10-03T12:45", ritrovo:"11:45", opp:"Orange 11 A.S.D.", home:false, place:"USD San Giorgio - Campo Nitti", address:"Via Nitti 6, 10137 Torino TO, Italia", score:"", giornata:"Andata, giornata 1"},
  {id:"262a12-2026-27-san-salvario-calendar", date:"2026-10-09T21:00", ritrovo:"20:00", opp:"Automotive Lighting Italia Spa", home:true, place:"USD San Giorgio - Campo Nitti", address:"Via Nitti 6, 10137 Torino TO, Italia", score:"", giornata:"Andata, giornata 2"},
  {id:"262a17-2026-27-san-salvario-calendar", date:"2026-10-16T21:00", ritrovo:"20:00", opp:"A.S.D. Oratorio Leini", home:true, place:"USD San Giorgio - Campo Nitti", address:"Via Nitti 6, 10137 Torino TO, Italia", score:""}
];
// I risultati stanno su Firebase (/t/<codice>/risultati/<id partita>): li inserisce lo staff dalla scheda "Risultato" del sito.
// La rosa sta su Firebase (/t/<codice>/roster): si modifica dalla console Firebase, non qui. Ogni persona: {name, number, role:"calciatore"|"dirigente"}.
let ROSTER = [];
/* ============================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const dDate = d => new Date(d).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const dShort = d => new Date(d).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}) + ' · ' + new Date(d).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const hhmm = d => new Date(d).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const DB = CONFIG.firebaseUrl.replace(/\/$/,'');
// Sito di test (…/sansalvario-test/): salva codice e nome con un prefisso, per non mescolarli col sito vero sullo stesso indirizzo.
const TEST = /-test\//.test(location.pathname);
const K = k => (TEST ? 'test-' : '') + k;
function setTheme(dark, keep){
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';

function useMatches(list){
  MATCHES = list.map(m => Object.assign({}, m, {base:{score:m.score || '', scorers:m.scorers || ''}})); applyResults();
  sorted = [...MATCHES].sort((a,b) => new Date(a.date) - new Date(b.date));
  const f = nextMatch() || sorted[sorted.length-1];
  S.sel = f ? f.id : '';
}
// I risultati di Firebase valgono sopra a quelli scritti nel calendario
function applyResults(){ MATCHES.forEach(m => { const r = results[m.id]; Object.assign(m, r ? {score:r.score, scorers:r.scorers} : m.base); }); }
useMatches(MATCHES);

/* ---- Lettura del calendario .ics ---- */
function parseICS(txt){
  const lines = txt.replace(/\r/g,'').replace(/\n[ \t]/g,'').split('\n'), out = []; let ev = null, al = false;
  for(const l of lines){
    if(l === 'BEGIN:VEVENT') ev = {};
    else if(l === 'BEGIN:VALARM') al = true;
    else if(l === 'END:VALARM') al = false;
    else if(l === 'END:VEVENT'){ if(ev && ev.DTSTART && !/CANCELLED/i.test(ev.STATUS||'')) out.push(ev); ev = null; }
    else if(ev && !al){
      const i = l.indexOf(':'); if(i < 0) continue;
      ev[l.slice(0,i).split(';')[0].toUpperCase()] = l.slice(i+1).replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');
    }
  }
  return out;
}
const p2 = n => String(n).padStart(2,'0');
function icsToMatch(ev){
  const m = ev.DTSTART.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?$/);
  const d = m[7] ? new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5])) : new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  const date = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const sum = (ev.SUMMARY||'').replace(/^[^\p{L}\p{N}]+/u,'').trim(), desc = ev.DESCRIPTION||'';
  const parts = sum.split(/\s+(?:-|–|—|vs\.?|v|contro)\s+/i);
  let opp = sum, home = true;
  if(parts.length >= 2){
    const u = parts.findIndex(x => /salvario/i.test(x));
    if(u === 1){ home = false; opp = parts[0]; } else { opp = parts[u === 0 ? 1 : 0]; }
  }
  if(/\bTrasferta\b/i.test(desc)) home = false; else if(/\bCasa\b/i.test(desc)) home = true;
  const g = desc.match(/(andata|ritorno)\s+giornata\s+(\d+)/i);
  const loc = (ev.LOCATION||'').trim(), c = loc.indexOf(',');
  const r = desc.match(/ritrovo[^0-9]{0,15}(\d{1,2})[:.](\d\d)/i);
  const rd = new Date(d.getTime() - 3600e3);
  const mk = desc.match(/marcatori\s*:\s*([^\n]+)/i);
  const sc = desc.match(/(?:risultato|finale)[^0-9]{0,10}(\d+\s*[-–]\s*\d+)/i);
  return {id: slug(ev.UID || date + opp), date, opp: opp.trim(), home,
    place: c > 0 ? loc.slice(0,c) : loc, address: c > 0 ? loc.slice(c+1).trim() : '',
    ritrovo: r ? p2(r[1]) + ':' + r[2] : p2(rd.getHours()) + ':' + p2(rd.getMinutes()), score: sc ? sc[1].replace(/\s/g,'') : '',
    scorers: mk ? mk[1].trim() : '',
    giornata: g ? g[1][0].toUpperCase() + g[1].slice(1).toLowerCase() + ', giornata ' + g[2] : ''};
}
async function loadICS(){
  if(!CONFIG.icsUrl) return;
  try{
    const r = await fetch(CONFIG.icsUrl.replace(/^webcal:/i,'https:'), {cache:'no-store'});
    if(!r.ok) throw 0;
    const list = parseICS(await r.text()).map(icsToMatch);
    if(list.length) useMatches(list);
  }catch(e){ /* se il file non è raggiungibile resta l’elenco MATCHES scritto qui sopra */ }
}
function outcome(m){
  const x = String(m.score||'').match(/(\d+)\D+(\d+)/); if(!x) return null;
  const a = +x[1], b = +x[2];
  return {gf:a, gs:b, label: a>b ? 'Vittoria' : a<b ? 'Sconfitta' : 'Pareggio', cls: a>b ? 'w' : a<b ? 'l' : 'd'};
}
function scorerList(str){
  return String(str||'').split(/[,;]/).map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^(.+?)\s*(?:\((\d+)\)|[x×]\s*(\d+)|\s(\d+))$/i);
    return m ? {name:m[1].trim(), n:+(m[2]||m[3]||m[4])} : {name:x, n:1};
  });
}
function scorerLabel(n){
  const sur = r => r.name.split(' ').slice(1).join(' '), ini = r => r.name[0].toUpperCase() + '.';
  const pl = ROSTER.filter(r => r.role === 'calciatore'), t = n.trim(), k = slug(t);
  const mi = t.match(/^(\p{L})\.?\s+(.+)$/u);
  let hits = pl.filter(r => slug(r.name) === k || slug(sur(r)) === k);
  if(hits.length !== 1 && mi) hits = pl.filter(r => r.name[0].toLowerCase() === mi[1].toLowerCase() && slug(sur(r)) === slug(mi[2]));
  if(hits.length !== 1) return t.charAt(0).toUpperCase() + t.slice(1);
  const r = hits[0], same = pl.filter(x => ini(x) === ini(r) && slug(sur(x)) === slug(sur(r))).length > 1;
  return same ? r.name : ini(r) + ' ' + sur(r);
}
const gName = g => scorerLabel(g.name) + (g.n > 1 ? ' ×' + g.n : '');
function scorerBlock(m){
  const sc = scorerList(m.scorers); if(!sc.length) return '';
  return `<div class="goals ${m.home ? 'c1' : 'c3'}"><ul aria-label="Marcatori">${sc.map(g => `<li>${esc(gName(g))}</li>`).join('')}</ul></div>`;
}

/* ---- Codice squadra: apre rosa e presenze su Firebase ---- */
const normCode = c => String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const surname = n => n.split(' ').slice(1).join(' ') || n;
// true = codice giusto, false = codice sbagliato; lancia un errore se manca la connessione
async function unlock(code){
  const r = await fetch(`${DB}/t/${code}/roster.json`, {cache:'no-store'});
  if(r.status === 401 || r.status === 403) return false;
  if(!r.ok) throw new Error(r.status);
  ROSTER = Object.values((await r.json()) || {}).sort((a,b) =>
    (a.role === b.role ? 0 : a.role === 'calciatore' ? -1 : 1) || surname(a.name).localeCompare(surname(b.name),'it') || a.name.localeCompare(b.name,'it'));
  BASE = `${DB}/t/${code}`;
  return true;
}
// Carica presenze e risultati; restituisce true se i risultati sono cambiati
async function load(){
  let changed = false;
  try{
    const [p, r, c] = await Promise.all(['presenze','risultati','convocati'].map(k => fetch(`${BASE}/${k}.json`, {cache:'no-store'})));
    LIVE = p.ok;
    if(p.ok) presences = (await p.json()) || {};
    if(c.ok) callups = (await c.json()) || {};
    if(r.ok){
      const next = (await r.json()) || {};
      changed = JSON.stringify(next) !== JSON.stringify(results);
      results = next; applyResults();
    }
  }catch(e){ LIVE = false; }
  return changed;
}
async function save(matchId, rec){
  const key = slug(rec.nome);
  try{
    const r = await fetch(`${BASE}/presenze/${matchId}/${key}.json`, {method:'PUT', body:JSON.stringify(rec)});
    if(!r.ok) return false;
    (presences[matchId] = presences[matchId] || {})[key] = rec;
    return true;
  }catch(e){ return false; }
}

// true = codice staff giusto, false = sbagliato; lancia un errore se manca la connessione
async function staffCheck(code){
  const r = await patch({[`proof/${code}/_check`]: TS});
  if(r.status === 401 || r.status === 403) return false;

async function saveResult(id, score, scorers){

const answers = () => Object.values(presences[S.sel] || {});
// Convocati della partita selezionata: fino a 20 disponibili sono tutti convocati, oltre decide lo staff
function callup(){
  const av = answers().filter(x => x.ruolo === 'calciatore' && x.stato === 'si');
  if(av.length <= MAX_CONV) return {auto:true, decided:true, av, list:av};
  const c = callups[S.sel], sel = (c && c.giocatori) || {};
  return {auto:false, decided:!!c, av, list:av.filter(x => sel[slug(x.nome)])};
}
// Solo lo staff può salvare: insieme ai convocati si scrive la prova sotto proof/<codice staff>
async function saveCallup(id, keys){
  try{
    const giocatori = Object.fromEntries(keys.map(k => [k, true]));
    const r = await patch({[`convocati/${id}`]: {giocatori, ts:TS}, [`proof/${STAFF}/${id}`]: TS});
    if(!r.ok) return false;
    callups[id] = {giocatori};
    return true;
  }catch(e){ return false; }
}

      <div class="seg">
        <div><label for="rgf">Gol San Salvario</label><input id="rgf" type="number" inputmode="numeric" min="0" max="99" value="${esc(S.rGf)}"></div>
        <div><label for="rgs">Gol ${esc(m.opp)}</label><input id="rgs" type="number" inputmode="numeric" min="0" max="99" value="${esc(S.rGs)}"></div>
      </div>
      <div class="step" style="margin-top:28px"><div class="num">02</div><div><h2>Marcatori</h2><p>Solo San Salvario, per cognome, separati da virgola. Doppietta: Rossi (2).</p></div></div>
      <label for="rsc">Marcatori</label>
      <input id="rsc" type="text" maxlength="300" autocomplete="off" value="${esc(S.rSc)}" placeholder="Es. Rossi (2), Bianchi">
      <p class="prev" id="prev"></p>
      <button class="go" id="rsave">Salva risultato</button>
      ${outcome(m) ? '<button class="link del" id="rclear">Elimina risultato</button>' : ''}
      ${okDiv()}`;
    resultInputs();
    return;
  }
  if(S.tab === 'sq'){
    const a = answers(), names = new Set(a.map(x => slug(x.nome)));
    const li = x => { const rk = ROSTER.find(r => slug(r.name) === slug(x.nome)); return `<li><div class="who">${rk && rk.number ? `<b class="nr">${rk.number}</b>` : '<b class="nr none"></b>'}${esc(x.nome)}</div><span>${x.tavola === 'si' ? 'A tavola' : ''}</span></li>`; };
    const grp = (t, arr) => `<div class="grp"><h3>${t} (${arr.length})</h3><ul>${arr.map(li).join('') || '<li><span>Nessuno</span></li>'}</ul></div>`;
    const wait = ROSTER.filter(r => !names.has(slug(r.name))).map(r => ({nome:r.name, ruolo:r.role}));
    const cu = callup(), inConv = new Set(cu.list.map(x => slug(x.nome)));
    const present = role => {
      const yes = a.filter(x => x.ruolo === role && x.stato === 'si');
      if(role !== 'calciatore') return grp('Presenti', yes);
      if(!cu.decided) return grp('Presenti', yes).replace('</h3>', `</h3><p class="note">Sono più di ${MAX_CONV}: convocazioni in attesa dello staff.</p>`);
      return grp('Convocati', cu.list) + (cu.auto ? '' : grp('Disponibili non convocati', yes.filter(x => !inConv.has(slug(x.nome)))));
    };
    const sec = (role, title) => {
      const ra = a.filter(x => x.ruolo === role), rw = wait.filter(x => x.ruolo === role);
      return `<h2 class="sqh">${title}<em>${ROSTER.filter(r => r.role === role).length}</em></h2>` +
        present(role) + grp('Assenti', ra.filter(x => x.stato === 'no')) + grp('Da confermare', rw);
    };
    b.innerHTML = sec('calciatore', 'Calciatori') + sec('dirigente', 'Dirigenti');
    return;
  }
  const m = match(), list = ROSTER.filter(r => r.role === S.role), me = ROSTER.find(r => r.name === S.pick);
  // a ogni cambio di partita o di nome riparti dalla risposta già salvata
  const fk = S.sel + '|' + S.pick;
  if(S.fFor !== fk){ S.fFor = fk; const r = mine(); S.stato = r ? r.stato : ''; S.tavola = r ? r.tavola : ''; }
  const saved = mine();
  if(over(m) && !S.fix){
    b.innerHTML = `<div class="past"><div class="step"><div class="num">${CLOCK}</div><div><h2>Partita finita</h2><p>${esc(dShort(m.date))}</p></div></div>
      ${me ? `<p class="mine">${saved ? `La tua risposta: <b>${esc(answerText(saved))}</b>` : `${esc(me.name)}, non avevi risposto.`}</p>` : ''}
      <p><button class="link" data-tab="sq">Vedi chi c’era</button>${me ? ` · <button class="link" data-fix="1">Correggi la tua risposta</button>` : ''}</p></div>`;
    return;
  }
  const who = me && !S.edit
    ? `<div class="step"><div class="num">01</div><div><h2>Sei ${esc(me.name)}</h2><p>${me.role === 'dirigente' ? 'Dirigente' : 'Calciatore'}${me.number ? ' · #' + me.number : ''} · <button class="link" data-edit="1">Cambia</button></p></div></div>`
    : `<div class="step"><div class="num">01</div><div><h2>Chi sei?</h2><p>Scegli il tuo nome dall’elenco o cercalo.</p></div></div>
    <div class="seg" role="group" aria-label="Ruolo"><button class="opt" data-role="calciatore" aria-pressed="${S.role==='calciatore'}">Calciatore</button><button class="opt" data-role="dirigente" aria-pressed="${S.role==='dirigente'}">Dirigente</button></div>
    <label for="pick">Scegli dall’elenco</label>
    <select id="pick"><option value="">Seleziona il tuo nome</option>${list.map(r => `<option value="${esc(r.name)}" ${r.name===S.pick?'selected':''}>${esc(r.name)}${r.number ? ' · #' + r.number : ''}</option>`).join('')}</select>
    <label for="typed">Oppure cerca il tuo nome</label>
    <div class="ac"><input id="typed" type="text" maxlength="30" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="acl" value="${esc(S.typed)}" placeholder="Scrivi nome, cognome o numero"><ul id="acl" role="listbox" aria-label="Nomi della rosa" hidden></ul></div>
    <p class="hint" id="achint"></p>`;
  const same = saved && saved.stato === S.stato && saved.tavola === S.tavola;
  const why = !me ? 'Prima scegli il tuo nome.' : !S.stato ? 'Rispondi a “Ci sei?”.' : !S.tavola ? 'Rispondi a “Resti a tavola?”.' : '';
  S.goOff = !!why || !!same;
  b.innerHTML = who + `
    ${saved ? `<p class="mine">La tua risposta: <b>${esc(answerText(saved))}</b></p>` : ''}
    <div class="step" style="margin-top:28px"><div class="num">02</div><div><h2 id="h-ci">Ci sei?</h2></div></div>
    <div class="seg" role="group" aria-labelledby="h-ci"><button class="opt yes" data-stato="si" aria-pressed="${S.stato==='si'}">Ci sono</button><button class="opt no" data-stato="no" aria-pressed="${S.stato==='no'}">Non ci sono</button></div>
    <div class="step"><div class="num">03</div><div><h2 id="h-tav">Resti a tavola?</h2><p>Per il dopo partita, anche se non giochi.</p></div></div>
    <div class="seg" role="group" aria-labelledby="h-tav"><button class="opt yes" data-tavola="si" aria-pressed="${S.tavola==='si'}">Sì</button><button class="opt" data-tavola="no" aria-pressed="${S.tavola==='no'}">No</button></div>
    ${same ? '' : `<button class="go" id="go" ${S.goOff ? 'disabled' : ''}>${saved ? 'Aggiorna risposta' : 'Conferma presenza'}</button>`}
    <p class="why" id="why">${why}</p>
    ${okDiv()}`;
  if(S.typed) acRender();
}
// Aggiorna anteprima marcatori e pulsante Salva senza ridisegnare il modulo
function resultInputs(){
  const sc = scorerList(S.rSc), ok = /^\d{1,2}$/.test(S.rGf) && /^\d{1,2}$/.test(S.rGs);
  const goals = sc.reduce((n, g) => n + g.n, 0);
  $('#prev').textContent = (sc.length ? 'Sul sito: ' + sc.map(gName).join(' · ') : 'Nessun marcatore.') +
    (ok && goals > +S.rGf ? ` Attenzione: ${goals} marcatori ma ${S.rGf} gol.` : '');
  $('#rsave').disabled = !ok;
}
// Aggiorna contatore e caselle dei convocati senza ridisegnare l’elenco
function callupInputs(){
  const n = S.cSel.size, full = n >= MAX_CONV;
  $('#cnt').textContent = `Convocati: ${n}/${MAX_CONV}`;
  $('#cnt').classList.toggle('full', full);
  document.querySelectorAll('[data-conv]').forEach(c => { c.disabled = full && !c.checked; c.closest('.pick').classList.toggle('off', c.disabled); });
}
/* ---- Ricerca del nome: suggerisce solo persone della rosa ---- */
function acMatches(q){
  const words = slug(q).split('-').filter(Boolean); if(!words.length) return [];
  return ROSTER.filter(r => { const parts = slug(r.name).split('-'); return words.every(w => parts.some(p => p.startsWith(w)) || String(r.number) === w); }).slice(0, 8);
}
function acRender(){
  const ul = $('#acl'), inp = $('#typed'), items = acMatches(S.typed), open = !!S.typed.trim();
  S.acList = items; S.acI = Math.min(S.acI || 0, Math.max(items.length - 1, 0));
  ul.innerHTML = items.map((r, i) => `<li role="option" id="aco-${i}" data-ac="${esc(r.name)}" aria-selected="${i === S.acI}">${r.number ? `<b class="nr">${r.number}</b>` : '<b class="nr none"></b>'}<span>${esc(r.name)}</span><small>${r.role === 'dirigente' ? 'Dirigente' : 'Calciatore'}</small></li>`).join('')
    || '<li class="none" role="option" aria-disabled="true">Nessuno con questo nome nella rosa</li>';
  ul.hidden = !open; inp.setAttribute('aria-expanded', open);
  if(items.length && open) inp.setAttribute('aria-activedescendant', 'aco-' + S.acI); else inp.removeAttribute('aria-activedescendant');
  $('#achint').textContent = open ? 'Scegli il tuo nome tra quelli proposti.' : '';
  const g = $('#go'); if(g) g.disabled = open || S.goOff;   // finché si sta cercando, il nome non è scelto   // finché si sta cercando, il nome non è scelto
}
function acChoose(name){
  const r = ROSTER.find(x => x.name === name); if(!r) return;
  S.pick = r.name; S.role = r.role; S.typed = ''; S.done = ''; S.edit = false; renderBody();
}
function renderFoot(){
  $('#foot').innerHTML = `<span class="foot-btns"><button class="out-btn" data-out="1">Esci da questo dispositivo</button>${STAFF ? '<button class="out-btn" data-staffout="1">Esci dall’area staff</button>' : '<button class="out-btn" data-staffin="1">Area staff</button>'}</span>`;
}
// Gol per giocatore sommando i marcatori di tutte le partite con un risultato
function renderRank(){
  const tot = new Map();
  sorted.filter(outcome).forEach(m => scorerList(m.scorers).forEach(g => { const k = scorerLabel(g.name); tot.set(k, (tot.get(k) || 0) + g.n); }));
  // a pari gol, ordine alfabetico per cognome ("J. Varvello" → Varvello; nome completo → cognome dalla rosa)
  const sur = l => { const i = l.match(/^\p{L}\.\s+(.+)$/u); if(i) return i[1]; const r = ROSTER.find(x => x.name === l); return r ? surname(r.name) : l; };
  const rows = [...tot].sort((a,b) => b[1] - a[1] || sur(a[0]).localeCompare(sur(b[0]),'it') || a[0].localeCompare(b[0],'it'));
  $('#rank').innerHTML = rows.map(([n, v], i) => {
    const pos = i && v === rows[i-1][1] ? '' : i + 1;   // a pari gol stessa posizione, mostrata una volta
    return `<li title="${esc(n)}: ${v} gol"><span class="pos">${pos}</span><span class="nm">${esc(n)}</span><b class="val">${v}</b></li>`;
  }).join('') || '<li class="none"><span class="empty">Nessun gol segnato finora.</span></li>';
}
function renderCal(){
  renderRank();
  const nx = nextMatch();
  $('#cal').innerHTML = subLinks() + sorted.map(m => `<button data-match="${m.id}" aria-current="${m.id===S.sel}"><span><b>${m.home?'San Salvario – '+esc(m.opp):esc(m.opp)+' – San Salvario'}</b><small>${esc(dShort(m.date))} · ${esc(m.place)}</small></span>${rBadge(m) || (nx && nx.id === m.id ? '<em class="nx">Prossima</em>' : '')}</button>`).join('');
}
function renderAll(){ $('#season').textContent = CONFIG.season; renderHero(); renderStats(); renderBody(); renderCal(); }

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if(d.side){ document.querySelectorAll('.swb').forEach(x => { x.setAttribute('aria-selected', x === t); x.tabIndex = x === t ? 0 : -1; }); $('#cal').hidden = d.side !== 'cal'; $('#rank').hidden = d.side !== 'rank'; }
  else if(d.tab){ S.tab = d.tab; renderBody(); }
  else if(d.role){ S.role = d.role; S.pick = ''; S.done = ''; renderBody(); }
  else if(d.stato){ S.stato = d.stato; S.done = ''; renderBody(); }
  else if(d.tavola){ S.tavola = d.tavola; renderBody(); }
  else if(d.edit){ S.edit = true; renderBody(); }
  else if(d.fix){ S.fix = true; renderBody(); }
  else if(d.out){ if(!confirm('Uscire da questo dispositivo? Per rientrare servirà di nuovo il codice squadra.')) return; try{ localStorage.removeItem(K('codice')); localStorage.removeItem(K('staff')); }catch(x){} location.reload(); }
  else if(d.staffin){ S.tab = 'staff'; S.done = ''; renderBody(); $('.panel').scrollIntoView({behavior:'smooth'}); }
  else if(d.staffout){ STAFF = ''; try{ localStorage.removeItem(K('staff')); }catch(x){} if(S.tab === 'staff' || S.tab === 'conv') S.tab = 'me'; renderBody(); renderFoot(); }
  else if(t.id === 'staffgo'){
    const code = normCode($('#staffcode').value);
    try{ say(code && await staffCheck(code) ? '' : 'Codice staff errato. Riprova.', true); }
    catch(x){ say('Non riesco a collegarmi. Controlla la connessione e riprova.', true); }
    if(!S.done){ STAFF = code; try{ localStorage.setItem(K('staff'), code); }catch(x){} S.done = ''; S.tab = 'conv'; S.cFor = ''; renderFoot(); }
    renderBody();
  }
  else if(t.id === 'csave'){
    const keys = [...S.cSel].slice(0, MAX_CONV);
    const ok = await saveCallup(S.sel, keys);
    say(ok ? 'Convocazioni salvate.' : 'Non sono riuscito a salvare. Controlla la connessione o rientra nell’area staff.', !ok);
    renderBody();
  }
  else if(t.id === 'rsave' || t.id === 'rclear'){
    const clear = t.id === 'rclear', id = S.sel, m = match(), o = outcome(m);
    if(clear && !confirm(`Eliminare il risultato ${m.home ? `San Salvario ${o.gf}–${o.gs} ${m.opp}` : `${m.opp} ${o.gs}–${o.gf} San Salvario`}?`)) return;
    const ok = await saveResult(id, clear ? '' : `${+S.rGf}-${+S.rGs}`, clear ? '' : scorerList(S.rSc).map(g => g.name + (g.n > 1 ? ` (${g.n})` : '')).join(', '));
    if(ok && clear){ S.rGf = S.rGs = S.rSc = ''; }
    say(ok ? (clear ? 'Risultato eliminato.' : 'Risultato salvato.') : 'Non sono riuscito a salvare. Controlla la connessione e riprova.', !ok);
    renderHero(); renderCal(); renderBody();
  }
  else if(d.match){ const inHero = !!t.closest('#hero'); S.sel = d.match; S.done = ''; S.fix = false; S.rFor = S.cFor = ''; renderAll(); if(!inHero) window.scrollTo({top:0,behavior:'smooth'}); }
  else if(t.id === 'go'){
    const r = ROSTER.find(x => x.name === S.pick); if(!r) return;   // solo nomi della rosa
    const upd = !!mine();
    const ok = await save(S.sel, {nome:r.name, ruolo:r.role, stato:S.stato, tavola:S.tavola});
    say(ok ? (upd ? 'Risposta aggiornata. Grazie!' : 'Presenza confermata. Grazie!') : 'Non sono riuscito a salvare. Controlla la connessione e riprova.', !ok);
    if(ok){ localStorage.setItem(K('mio'), JSON.stringify({role:S.role, pick:S.pick})); }
    renderStats(); renderBody();
  }
});
document.addEventListener('change', e => {
  const ck = e.target.dataset && e.target.dataset.conv;
  if(ck){ e.target.checked ? S.cSel.add(ck) : S.cSel.delete(ck); $('#ok').textContent = ''; callupInputs(); return; }
  if(e.target.id === 'pick'){ S.pick = e.target.value; S.typed = ''; S.done = ''; S.edit = false; renderBody(); }
});
document.addEventListener('input', e => {
  const rk = {rgf:'rGf', rgs:'rGs', rsc:'rSc'}[e.target.id];
  if(rk){ S[rk] = e.target.value.trim(); S.done = ''; $('#ok').textContent = ''; resultInputs(); return; }
  if(e.target.id === 'typed'){ S.typed = e.target.value; S.acI = 0; S.done = ''; acRender(); }
});

document.addEventListener('keydown', e => {
  if(e.target.id !== 'typed' || $('#acl').hidden) return;
  const n = (S.acList || []).length;
  if(e.key === 'ArrowDown' && n){ e.preventDefault(); S.acI = (S.acI + 1) % n; acRender(); }
  else if(e.key === 'ArrowUp' && n){ e.preventDefault(); S.acI = (S.acI - 1 + n) % n; acRender(); }
  else if(e.key === 'Enter' && n){ e.preventDefault(); acChoose(S.acList[S.acI].name); }
  else if(e.key === 'Escape'){ $('#acl').hidden = true; e.target.setAttribute('aria-expanded', false); }
});
// frecce, Home e Fine per muoversi tra le schede
document.addEventListener('keydown', e => {
  const t = e.target.closest && e.target.closest('[role=tab]'); if(!t || !['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
  const all = [...t.parentNode.querySelectorAll('[role=tab]:not([hidden])')], i = all.indexOf(t);
  const n = e.key === 'Home' ? all[0] : e.key === 'End' ? all[all.length-1] : all[(i + (e.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length];
  e.preventDefault(); n.click(); n.focus();
});
document.addEventListener('focusout', e => { if(e.target.id === 'typed'){ $('#acl').hidden = true; e.target.setAttribute('aria-expanded', false); } });
document.addEventListener('focusin', e => { if(e.target.id === 'typed' && S.typed) acRender(); });
// pointerdown (non click) così il campo non perde il focus prima della scelta
document.addEventListener('pointerdown', e => {
  const o = e.target.closest('[data-ac]'); if(!o) return;
  e.preventDefault(); acChoose(o.dataset.ac);
});

document.addEventListener('submit', async e => {
  if(e.target.id !== 'lock') return;
  e.preventDefault();
  const code = normCode($('#code').value), err = $('#err');
  err.textContent = '';
  try{
    if(!code || !(await unlock(code))){ err.textContent = 'Codice errato. Riprova.'; return; }
  }catch(x){ err.textContent = 'Non riesco a collegarmi. Controlla la connessione e riprova.'; return; }
  try{ localStorage.setItem(K('codice'), code); }catch(x){}
  start();
});

let started = false;
async function start(){
  if(started) return; started = true;
  $('#lock').hidden = true;
  renderFoot();
  await loadICS(); await load(); renderAll(); renderLive();
  $('#app').hidden = false;
  setInterval(async () => { if(await load()){ renderHero(); renderCal(); } renderLive(); renderStats(); if(S.tab === 'sq') renderBody(); }, 5000);
}
(async () => {
  let saved = '';
  try{ saved = localStorage.getItem(K('codice')) || ''; }catch(e){}
  try{ if(saved && await unlock(saved)) return start(); }
  catch(e){ $('#err').textContent = 'Non riesco a collegarmi. Controlla la connessione e riprova.'; }
  $('#lock').hidden = false;
})();
</script>
</body>
</html>
